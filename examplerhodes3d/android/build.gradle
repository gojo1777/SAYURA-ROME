buildscript {
    ext.kotlin_version = '1.9.24'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.3.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(':app')
}

// Fix for older plugins (e.g. openworld_gl) published before AGP required
// an explicit `namespace` in build.gradle. AGP 8+ no longer infers the
// namespace from AndroidManifest.xml's package attribute, so we patch it
// in here automatically for any subproject missing it. We hook into
// plugins.withId (fires as soon as the plugin is applied) instead of
// afterEvaluate, since by the time subprojects afterEvaluate runs with
// Flutter's newer plugin loader, the project may already be evaluated.
subprojects { subproject ->
    ['com.android.library', 'com.android.application'].each { pluginId ->
        subproject.plugins.withId(pluginId) {
            def androidExt = subproject.extensions.findByName('android')
            if (androidExt != null && androidExt.hasProperty('namespace') && androidExt.namespace == null) {
                def manifestFile = subproject.file('src/main/AndroidManifest.xml')
                if (manifestFile.exists()) {
                    def manifestXml = new XmlSlurper().parse(manifestFile)
                    def packageName = manifestXml.@package.text()
                    if (packageName) {
                        androidExt.namespace = packageName
                    }
                }
            }
        }
    }
}

// Fix for "Inconsistent JVM-target compatibility" errors in older plugins
// (e.g. openworld_gl) that don't pin a Kotlin jvmTarget themselves and end
// up inheriting Java 17 (from CI's setup-java) for Kotlin while their javac
// stays at 1.8. Force every subproject's Kotlin compile tasks to 1.8 to
// match, right when the Kotlin plugin is applied.
subprojects { subproject ->
    subproject.plugins.withId('org.jetbrains.kotlin.android') {
        subproject.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                jvmTarget = "1.8"
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
