org.gradle.jvmargs=-Xmx1536M
android.useAndroidX=true
android.enableJetifier=true

# --- Compatibility flags for older Flutter plugins under AGP 8.x ---
# AGP 8 stopped generating BuildConfig by default; several older plugins
# still reference it and fail to compile without this.
android.defaults.buildfeatures.buildconfig=true
# Downgrade Kotlin "inconsistent JVM-target" mismatches (Java vs Kotlin
# compile tasks) from hard build failures to warnings, project-wide, so
# any plugin with this issue (not just openworld_gl) doesn't break the build.
kotlin.jvm.target.validation.mode=warning
# Silence "compileSdk 35 not yet officially tested" noise from AGP 8.3.0.
android.suppressUnsupportedCompileSdk=35
